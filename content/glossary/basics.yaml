- k: set
  zh: 集合
  en: Set
  short: '一些确定的、互不相同的对象放在一起组成的整体，例如 $X=\{\text{苹果},\text{香蕉},\text{橙子}\}$。只管有没有，不管顺序和重复。'
  where: basics/sets-logic#set

- k: element
  zh: 元素
  en: Element
  short: '集合里的每一个对象。$x\in A$ 读作“$x$ 属于 $A$”，$x\notin A$ 读作“$x$ 不属于 $A$”。'
  where: basics/sets-logic#set

- k: empty-set
  zh: 空集
  en: Empty set
  short: '一个元素都没有的集合，记作 $\varnothing$。它是任何集合的子集；$C(B)=\varnothing$ 表示菜单上一样都选不出来。'
  where: basics/sets-logic#set

- k: subset
  zh: 子集
  en: Subset
  short: '若 $A$ 的每个元素都在 $B$ 里，就说 $A$ 是 $B$ 的子集，记作 $A\subseteq B$。例如菜单 $B\subseteq X$。'
  where: basics/sets-logic#subset

- k: union
  zh: 并集
  en: Union
  short: '$A\cup B$：至少属于 $A$、$B$ 之一的元素组成的集合。例如 $B\cup\{x\}$ 是往菜单 $B$ 里加一个选项 $x$。'
  where: basics/sets-logic#subset

- k: intersection
  zh: 交集
  en: Intersection
  short: '$A\cap B$：同时属于 $A$ 和 $B$ 的元素组成的集合，即两份菜单上都有的选项。'
  where: basics/sets-logic#subset

- k: set-builder
  zh: 集合描述法
  en: Set-builder notation
  short: '$\{x\in A\mid P(x)\}$：从 $A$ 里挑出所有满足条件 $P(x)$ 的元素。竖线读作“使得”，也有书写成冒号。'
  where: basics/sets-logic#set-builder

- k: interval
  zh: 区间
  en: Interval
  short: '数轴上的一段。方括号含端点、圆括号不含：$[0,1]$ 含 0 和 1，$[0,1)$ 含 0 不含 1。'
  where: basics/sets-logic#set-builder

- k: cardinality
  zh: 元素个数（基数）
  en: Cardinality
  short: '有限集合 $B$ 的元素个数，记作 $|B|$。$|\varnothing|=0$；$n$ 个元素的集合有 $2^n$ 个子集。'
  where: basics/sets-logic#cardinality

- k: real-numbers
  zh: 实数集
  en: Real numbers
  short: '数轴上全部的数，记作 $\R$。$\R^n$ 是 $n$ 个实数排成的数组，$\R^n_+$ 要求每个分量都 $\ge0$，即商品篮子所在的空间。'
  where: basics/sets-logic#real-numbers

- k: ordered-pair
  zh: 有序对
  en: Ordered pair
  short: '$(x,y)$：第一个位置放 $x$、第二个位置放 $y$，顺序不能换，$(2,3)\ne(3,2)$。'
  where: basics/sets-logic#cartesian

- k: cartesian-product
  zh: 笛卡尔积
  en: Cartesian product
  short: '$X\times Y=\{(x,y)\mid x\in X,\ y\in Y\}$，所有配对组成的集合；有限时 $|X\times Y|=|X|\cdot|Y|$。$\R\times\R=\R^2$。'
  where: basics/sets-logic#cartesian

- k: sufficient-condition
  zh: 充分条件
  en: Sufficient condition
  short: '若 $P\Rightarrow Q$，则 $P$ 是 $Q$ 的充分条件：有 $P$ 就足以保证 $Q$。例如“完备且传递”是“选得出东西”的充分条件。'
  where: basics/sets-logic#logic

- k: necessary-condition
  zh: 必要条件
  en: Necessary condition
  short: '若 $P\Rightarrow Q$，则 $Q$ 是 $P$ 的必要条件：没有 $Q$ 就一定没有 $P$（逆否命题）。'
  where: basics/sets-logic#logic

- k: for-all
  zh: 全称量词（对所有）
  en: For all
  short: '$\forall x\in A$：$A$ 里每一个 $x$，没有例外。推翻它只需一个反例。'
  where: basics/sets-logic#quantifiers

- k: there-exists
  zh: 存在量词（存在）
  en: There exists
  short: '$\exists x\in A$：$A$ 里至少能找到一个 $x$。'
  where: basics/sets-logic#quantifiers

- k: negation
  zh: 否定
  en: Negation
  short: '命题 $P$ 不成立，记作 $\neg P$。否定时“所有”变“存在”、“存在”变“所有”，后面的话也取反。'
  where: basics/sets-logic#quantifiers

- k: iff
  zh: 当且仅当
  en: If and only if
  short: '$P\iff Q$：$P\Rightarrow Q$ 且 $Q\Rightarrow P$。证明时两个方向都要证。'
  where: basics/sets-logic#iff-proof

- k: induction
  zh: 数学归纳法
  en: Mathematical induction
  short: '证明 $P(1)$ 成立，再证明对每个 $n$ 由 $P(n)$ 推出 $P(n+1)$，就得到 $P(n)$ 对所有正整数成立。像推多米诺骨牌。'
  where: basics/sets-logic#induction

- k: proof-by-contradiction
  zh: 反证法
  en: Proof by contradiction
  short: '要证 $P$，先假设 $P$ 不成立，推出一个矛盾，于是 $P$ 成立。例如证明 $[0,1)$ 没有最大的数。'
  where: basics/sets-logic#contradiction

- k: function
  zh: 函数
  en: Function
  short: '$f:A\to B$ 给 $A$ 中每个元素指定 $B$ 中恰好一个元素 $f(a)$。多对一可以，一对多不行。'
  where: basics/functions-relations#function

- k: domain
  zh: 定义域
  en: Domain
  short: '函数 $f:A\to B$ 的输入范围 $A$。定义域里每个元素都必须有输出。'
  where: basics/functions-relations#function

- k: codomain
  zh: 陪域
  en: Codomain
  short: '函数 $f:A\to B$ 箭头后面的集合 $B$，说明输出落在哪里；不要求每个元素都被取到。'
  where: basics/functions-relations#function

- k: range
  zh: 值域
  en: Range
  short: '函数实际取到的所有值 $f(A)=\{f(a)\mid a\in A\}$，是陪域的子集。'
  where: basics/functions-relations#image-range

- k: image
  zh: 像
  en: Image
  short: '对 $S\subseteq A$，$f(S)=\{f(a)\mid a\in S\}$ 是只看 $S$ 里的输入时取到的值。'
  where: basics/functions-relations#image-range

- k: increasing-function
  zh: 递增函数
  en: Increasing function
  short: '$a<b\Rightarrow f(a)\le f(b)$：输入变大，输出不变小（单调不减）。例如出租车计价。'
  where: basics/functions-relations#increasing

- k: strictly-increasing
  zh: 严格递增
  en: Strictly increasing
  short: '$a<b\Rightarrow f(a)<f(b)$：输入变大，输出一定变大。对效用做严格递增变换不改变排序。'
  where: basics/functions-relations#increasing

- k: composite-function
  zh: 复合函数
  en: Composite function
  short: '$(v\circ u)(x)=v(u(x))$：先算 $u(x)$，再放进 $v$。顺序一般不能换。'
  where: basics/functions-relations#composition

- k: argmax
  zh: 最大值点集
  en: Argmax
  short: '$\arg\max_{x\in B}f(x)=\{x\in B\mid f(x)\ge f(y)\ \forall y\in B\}$：拿到最高分的那些选项，是一个集合，可能为空。最大值是数，argmax 是集合。'
  where: basics/functions-relations#argmax

- k: binary-relation
  zh: 二元关系
  en: Binary relation
  short: '$X$ 上的二元关系是 $X\times X$ 的一个子集；$(x,y)$ 在里面就写 $xRy$。偏好 $\succeq$ 就是一个二元关系。'
  where: basics/functions-relations#relation

- k: reflexivity
  zh: 自反性
  en: Reflexivity
  short: '对所有 $x$，$xRx$。完备性推出自反性；严格偏好 $\succ$ 不自反。'
  where: basics/functions-relations#relation-properties

- k: symmetry
  zh: 对称性
  en: Symmetry
  short: '$xRy\Rightarrow yRx$。无差异 $\sim$、“是朋友”是对称的；$\succeq$ 一般不是。'
  where: basics/functions-relations#relation-properties

- k: weak-order
  zh: 弱序
  en: Weak order
  short: '完备且传递的关系，允许并列。理性偏好就是弱序。'
  where: basics/functions-relations#order

- k: partial-order
  zh: 偏序
  en: Partial order
  short: '自反、传递、反对称但不一定完备的关系，有些对子比不了。例如篮子的逐分量比较 $x\ge y$、集合的包含 $\subseteq$。'
  where: basics/functions-relations#order

- k: sequence
  zh: 序列
  en: Sequence
  short: '按顺序排好的一列数或点 $x_1,x_2,x_3,\dots$，例如 $x_n=\tfrac1n$。'
  where: basics/sequences-continuity#sequence

- k: limit
  zh: 极限
  en: Limit
  short: '$x_n\to L$：对任意 $\varepsilon>0$，存在 $N$，使 $n\ge N$ 时 $|x_n-L|<\varepsilon$。大白话：等得够久，就要多近有多近。'
  where: basics/sequences-continuity#limit

- k: convergence
  zh: 收敛
  en: Convergence
  short: '序列有极限就叫收敛，例如 $\tfrac1n\to0$；没有极限叫发散，例如 $(-1)^n$。'
  where: basics/sequences-continuity#limit

- k: distance
  zh: 距离
  en: Distance
  short: '两点的直线距离 $d(x,y)=\sqrt{(x_1-y_1)^2+\cdots+(x_k-y_k)^2}$。'
  where: basics/sequences-continuity#distance-ball

- k: epsilon-ball
  zh: ε 邻域
  en: Epsilon-ball
  short: '$B_\varepsilon(y)=\{x\mid d(x,y)<\varepsilon\}$：离 $y$ 不到 $\varepsilon$ 的所有点，平面上是一个不含边的圆盘。'
  where: basics/sequences-continuity#distance-ball

- k: closed-set
  zh: 闭集
  en: Closed set
  short: '集合里的收敛序列，极限也在集合里。$[0,1]$ 是闭集，$[0,1)$ 不是（$1-\tfrac1n\to1$ 跑出去了）。'
  where: basics/sequences-continuity#closed-set

- k: continuous-function
  zh: 连续函数
  en: Continuous function
  short: '只要 $x_n\to x$，就有 $f(x_n)\to f(x)$：输入差一点，输出也只差一点，不会跳。阶梯电价连续，快递运费不连续。'
  where: basics/sequences-continuity#continuity-function

- k: countable
  zh: 可数
  en: Countable
  short: '有限，或能排成一队 $s_1,s_2,\dots$ 让每个元素都编上号。正整数、有理数可数；实数不可数。'
  where: basics/sequences-continuity#countable

- k: rational-numbers
  zh: 有理数
  en: Rational numbers
  short: '能写成分数 $\tfrac pq$ 的数，记作 $\mathbb{Q}$。可数，并且任意一段长度大于 0 的区间里都有有理数。'
  where: basics/sequences-continuity#countable

- k: convex-combination
  zh: 凸组合
  en: Convex combination
  short: '$tx+(1-t)x''$，$t\in[0,1]$：按比例混合两个篮子，逐个分量算。所有凸组合组成连接 $x$、$x''$ 的线段。'
  where: basics/convexity#convex-combination

- k: convex-set
  zh: 凸集
  en: Convex set
  short: '任取两点，连线整段都在集合里：$x,x''\in S$、$t\in[0,1]$ 时 $tx+(1-t)x''\in S$。预算集是凸集，月牙不是。'
  where: basics/convexity#convex-set

- k: concave-function
  zh: 凹函数
  en: Concave function
  short: '$f(tx+(1-t)y)\ge tf(x)+(1-t)f(y)$：图像在弦的上方，例如 $\sqrt x$。凹性不是偏好的性质，严格递增变换会改变它。'
  where: basics/convexity#concave

- k: convex-function
  zh: 凸函数
  en: Convex function
  short: '$f(tx+(1-t)y)\le tf(x)+(1-t)f(y)$：图像在弦的下方，例如 $x^2$。注意它和“凸偏好”“凸集”不是一回事。'
  where: basics/convexity#concave
