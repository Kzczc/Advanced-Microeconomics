# Course structure. The build script turns this into navigation and pages.
course:
  title_zh: 高级微观经济学 · 逐页精讲
  title_en: Advanced Microeconomics — Slide-by-slide Notes
  instructor: Siguang Li (HKUST(GZ))
  term: Fall 2025

lectures:
  - id: lecture1
    no: 1
    title_en: "Choice Theory"
    title_zh: "选择理论：偏好、选择与效用"
    slides_pdf: slides/lecture1.pdf
    reading_pdf: readings/reading1_choice_theory.pdf
    n_slides: 29
    status: ready
    sections:
      - id: intro
        title_zh: "引子：微观经济学从个人决策出发"
        intro: "为什么经济学要从“一个人怎么做选择”讲起，以及“理性选择”这套框架的优点。"
        slides: [1, 2]
      - id: preferences
        title_zh: "偏好与选择规则"
        intro: "用符号精确描述“谁比谁好”；理性偏好的两条要求；从偏好得到“选哪个”。"
        slides: [3, 4, 5, 6, 7]
      - id: revealed
        title_zh: "显示偏好：从看到的选择反推偏好"
        intro: "反过来问：只看到一个人的选择，能不能判断他背后有一套理性偏好？答案是 HARP。"
        slides: [8, 9, 10, 11, 12, 13]
      - id: utility
        title_zh: "效用函数：给偏好打分"
        intro: "把偏好翻译成数字：什么时候可以、为什么有时不行、分数本身有没有意义。"
        slides: [14, 15, 16, 17]
      - id: restrictions
        title_zh: "对偏好的常用限制"
        intro: "单调、局部非饱和、凸性、可分性、拟线性：它们各自的含义和对应的效用函数性质。"
        slides: [18, 19, 20, 21, 22]
      - id: behavioral
        title_zh: "行为经济学的批评"
        intro: "现实中的人并不总按理性模型行事：情境、框架、锚定、默认选项……以及这对政策分析意味着什么。"
        slides: [23, 24, 25, 26, 27, 28, 29]

  - id: lecture2
    no: 2
    title_en: "Consumer Theory"
    title_zh: "消费者理论：需求、对偶与福利"
    slides_pdf: slides/lecture2.pdf
    reading_pdf: readings/reading2_consumer_theory.pdf
    n_slides: 55
    status: planned
    sections:
      - id: budget
        title_zh: "消费者问题与预算集"
        intro: "消费者要在买得起的组合里挑最好的：预算集长什么样，价格和收入变了它怎么变。"
        slides: [1, 2, 3, 4, 5]
      - id: marshallian
        title_zh: "马歇尔需求及其性质"
        intro: "给定价格和收入的最优购买组合：它存在吗、唯一吗？价格和收入同比例变化会怎样？钱会不会花光？"
        slides: [6, 7, 8, 9, 10, 11, 12]
      - id: indirect
        title_zh: "间接效用函数"
        intro: "把“最多能达到多少效用”看成价格和收入的函数：它有哪些性质，为什么。"
        slides: [13, 14, 15, 16]
      - id: kuhn-tucker
        title_zh: "拉格朗日方法与库恩–塔克条件"
        intro: "用拉格朗日乘子求最优解；最优解落在边界（某样东西一点不买）时怎么办：库恩–塔克条件。"
        slides: [17, 18, 19, 20, 21]
      - id: envelope
        title_zh: "包络定理与罗伊恒等式"
        intro: "参数变化时最优值怎样变：包络定理；乘子就是“钱的边际效用”；从间接效用函数直接读出需求。"
        slides: [22, 23, 24, 25]
      - id: hicksian
        title_zh: "支出最小化与希克斯需求"
        intro: "反过来问：要达到某个效用水平，最少要花多少钱？希克斯需求、支出函数与谢泼德引理。"
        slides: [26, 27, 28, 29, 30, 31]
      - id: comparative
        title_zh: "比较静态：需求定律与替代矩阵"
        intro: "价格变化时需求怎样变：补偿需求定律，替代矩阵为什么对称、半负定。"
        slides: [32, 33, 34, 35, 36, 37, 38]
      - id: slutsky
        title_zh: "对偶关系与斯卢茨基方程"
        intro: "两种需求、两种值函数怎样互相转换；把价格变化的影响拆成替代效应和收入效应。"
        slides: [39, 40, 41, 42, 43, 44, 45, 46]
      - id: welfare
        title_zh: "价格变化的福利度量"
        intro: "涨价让人损失了多少？补偿变化、等价变化、消费者剩余，以及它们在图上的含义。"
        slides: [47, 48, 49, 50, 51, 52, 53, 54, 55]

  - id: lecture3
    no: 3
    title_en: "Decision Theory under Uncertainty"
    title_zh: "不确定性下的决策：期望效用与风险态度"
    slides_pdf: slides/lecture3.pdf
    reading_pdf: readings/reading3_uncertainty.pdf
    n_slides: 68
    status: planned

basics:
  - id: sets-logic
    title_zh: "集合、逻辑符号与证明方法"
  - id: functions-relations
    title_zh: "函数与二元关系"
  - id: sequences-continuity
    title_zh: "序列、极限与连续"
  - id: convexity
    title_zh: "凸集、凸组合与拟凹函数"
